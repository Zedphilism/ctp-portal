<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <script src="assets/theme-rotator.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CT&P Portal | Analytics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="./assets/app.css">
</head>
<body class="bg-slate-50 text-slate-900">
  <header class="sticky top-0 z-40 border-b border-slate-200 glass">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between gap-3">
      <div>
        <div class="text-lg font-extrabold">Analytics</div>
        <div class="text-xs smallmuted">Read only insights</div>
      </div>
      <nav class="flex items-center gap-2 flex-wrap justify-end">
        <a class="px-3 py-2 rounded-xl bg-white border border-slate-200 hover:bg-slate-50 text-sm font-semibold" href="./index.html">Jobs</a>
        <a class="px-3 py-2 rounded-xl bg-white border border-slate-200 hover:bg-slate-50 text-sm font-semibold" href="./inspectors.html">Inspectors</a>
        <a class="px-3 py-2 rounded-xl bg-slate-900 text-white text-sm font-semibold" href="./analytics.html">Analytics</a>
        <a class="px-3 py-2 rounded-xl bg-white border border-slate-200 hover:bg-slate-50 text-sm font-semibold" href="./timeline.html">Timeline</a>
        <a class="px-3 py-2 rounded-xl bg-white border border-slate-200 hover:bg-slate-50 text-sm font-semibold" href="./map.html">Map</a>
        <a class="px-3.5 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold inline-flex items-center gap-1.5 shadow-sm transition" href="./ctpreprt.html" title="Buka Laporan Lengkap & Analitik Sel Teknikal">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
          Full Report
        </a>
      </nav>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6">
    <section class="card bg-white p-4">
      <div class="flex items-center justify-between flex-wrap gap-2">
        <div class="flex items-center gap-3">
          <div class="font-bold text-base">Snapshot</div>
          <a href="./ctpreprt.html" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-lg bg-blue-50 border border-blue-200 text-blue-700 hover:bg-blue-100 text-xs font-bold transition" title="Buka Laporan Lengkap & Analitik Sel Teknikal">
            <svg class="w-3.5 h-3.5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
            <span>Full Report (Pemeriksaan Alat Ganti & Mewujudkan Dokumen)</span>
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
          </a>
        </div>
        <div class="text-xs smallmuted" id="meta">Loading...</div>
      </div>
      <div class="mt-2 text-sm" id="summary"></div>
    </section>

    <section class="mt-4 grid grid-cols-1 lg:grid-cols-2 gap-4">
      <div class="card bg-white p-4">
        <div class="font-bold mb-2">Jobs by Status</div>
        <canvas id="cStatus"></canvas>
      </div>
      <div class="card bg-white p-4">
        <div class="font-bold mb-2">Jobs by Zon</div>
        <canvas id="cZon"></canvas>
      </div>
      <div class="card bg-white p-4">
        <div class="font-bold mb-2">Jobs by Negeri</div>
        <canvas id="cNegeri"></canvas>
      </div>
      <div class="card bg-white p-4">
        <div class="font-bold mb-2">Workload by Inspector</div>
        <canvas id="cInspector"></canvas>
      </div>
    </section>
  </main>

  <script src="./js/config.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/pages.analytics.js"></script>
</body>
</html>
