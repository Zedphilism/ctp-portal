<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portal CT&P · Sistem Pemeriksaan ATM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,600&display=swap" rel="stylesheet" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    :root{
      /* Stark mono palette, warm off-black */
      --bg: #0d0e0c;
      --bg-2: #131410;
      --ink: #ededdf;
      --ink-2: #b8b8a8;
      --ink-3: #6a6a5e;
      --rule: #2a2b25;
      --rule-2: #1c1d18;
      /* Single bright accent */
      --acc: oklch(0.88 0.21 130);          /* chartreuse */
      --acc-dim: oklch(0.88 0.21 130 / .35);
      --acc-bg: oklch(0.88 0.21 130 / .08);
      /* Status hues, low chroma */
      --warn: oklch(0.82 0.16 75);
      --bad:  oklch(0.72 0.18 25);
      --ok: var(--acc);
    }

    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      font-family:'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
      background: var(--bg);
      color: var(--ink);
      min-height:100vh;
      overflow-x:hidden;
      font-feature-settings:'ss01','cv02','cv11';
      -webkit-font-smoothing:antialiased;
    }

    /* fine grid texture */
    body::before{
      content:"";
      position:fixed;inset:0;pointer-events:none;z-index:0;
      background-image:
        linear-gradient(to right, rgba(237,237,223,.025) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(237,237,223,.025) 1px, transparent 1px);
      background-size: 80px 80px;
    }

    a{color:inherit}

    /* ── Engine canvas ── */
    .engine-bg{
      position:fixed; inset:0;
      z-index:1;
      pointer-events:none;
      display:flex; align-items:center; justify-content:center;
    }
    .engine-bg svg{ width:100%; height:100%; pointer-events:auto; }
    .engine-bg::after{
      content:"";
      position:absolute;inset:0;pointer-events:none;
      background:
        radial-gradient(ellipse at center, transparent 50%, rgba(13,14,12,.7) 100%);
    }

    /* ── Stage layout ── */
    .stage{
      position:relative;
      z-index:5;
      max-width:1480px;
      margin:0 auto;
      padding:24px 28px 28px;
      min-height:100vh;
      display:grid;
      grid-template-rows:auto auto 1fr auto;
      gap:20px;
      pointer-events:none;
    }
    .stage > *{pointer-events:auto}

    /* ── Top rail ── */
    .top-rail{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:24px;
      padding:10px 0 14px;
      border-bottom:1px solid var(--rule);
      font-size:11px;
      letter-spacing:.04em;
    }
    .top-rail-l, .top-rail-r{ display:flex; align-items:center; gap:18px; }
    .brand-mark{
      display:flex; align-items:center; gap:10px;
      padding-right:18px;
      border-right:1px solid var(--rule);
    }
    .brand-mark img{ width:22px; height:22px; object-fit:contain; }
    .brand-name{
      font-weight:600; letter-spacing:.18em;
      text-transform:uppercase; font-size:11px;
    }
    .brand-name span{ color:var(--ink-3); margin:0 8px;}
    .top-meta{
      color:var(--ink-3);
      text-transform:uppercase;
      letter-spacing:.18em;
      font-size:10.5px;
    }
    .top-meta b{ color:var(--ink-2); font-weight:500;}
    .top-meta .live{ color:var(--acc); }
    .top-meta .live::before{
      content:"●"; margin-right:6px;
      animation: blink 1.6s infinite step-end;
    }
    @keyframes blink{ 50%{ opacity:.25 } }

    /* ── Hero ── */
    .hero{
      display:grid;
      grid-template-columns: 1fr auto;
      gap:32px;
      align-items:end;
      padding:24px 0 8px;
      min-height:200px;
    }
    .hero-l{ display:flex; flex-direction:column; gap:18px; max-width:760px;}
    .hero-eyebrow{
      display:flex; align-items:center; gap:14px;
      font-size:10.5px;
      letter-spacing:.22em;
      text-transform:uppercase;
      color:var(--ink-3);
    }
    .hero-eyebrow .pip{
      display:inline-block;
      width:24px; height:1px;
      background:var(--acc);
    }
    .hero-eyebrow b{ color:var(--acc); font-weight:500;}

    .hero-title{
      margin:0;
      font-family:'JetBrains Mono', monospace;
      font-weight:500;
      font-size: clamp(34px, 4.6vw, 64px);
      line-height: 1.02;
      letter-spacing: -0.02em;
      color: var(--ink);
      text-wrap: balance;
    }
    .hero-title em{
      font-family:'Fraunces', serif;
      font-style:italic;
      font-weight:400;
      font-variation-settings:'opsz' 144;
      color: var(--acc);
      letter-spacing:-.01em;
    }
    .hero-title .slash{ color:var(--ink-3); font-weight:300;}

    .hero-sub{
      margin:0;
      max-width: 64ch;
      font-size:12.5px;
      line-height:1.7;
      color:var(--ink-2);
      text-wrap:pretty;
    }
    .hero-sub::before{
      content:"// ";
      color:var(--ink-3);
    }

    .hero-r{
      align-self:end;
      display:flex; flex-direction:column; align-items:flex-end; gap:12px;
    }
    .hero-r .stamp{
      font-size:10.5px;
      letter-spacing:.2em;
      color:var(--ink-3);
      text-transform:uppercase;
    }
    .hero-r .ver{
      font-size:11.5px; color:var(--ink-2);
      letter-spacing:.04em;
    }
    .hero-r .ver b{ color:var(--ink); font-weight:500;}

    /* ── CTA bar ── */
    .cta-bar{
      display:flex; align-items:stretch;
      border-top:1px solid var(--rule);
      border-bottom:1px solid var(--rule);
      margin-top:6px;
    }
    .cta-bar .cmd{
      flex:1;
      display:flex; align-items:center; gap:16px;
      padding:16px 0;
      font-size:13px;
      color:var(--ink-2);
    }
    .cta-bar .cmd .prompt{ color:var(--acc); }
    .cta-bar .cmd .typed{ color:var(--ink); }
    .cta-bar .cmd .caret{
      display:inline-block; width:8px; height:14px; vertical-align:-2px;
      background:var(--acc);
      animation: blink 1s infinite step-end;
    }
    .cta-bar .go{
      display:inline-flex; align-items:center; gap:12px;
      padding:0 22px;
      border-left:1px solid var(--rule);
      font-size:12px;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:var(--ink);
      text-decoration:none;
      transition: background .15s, color .15s;
    }
    .cta-bar .go:hover{ background:var(--acc); color:var(--bg);}
    .cta-bar .go svg{ width:14px; height:14px; }

    /* ── Body two-col ── */
    .body-grid{
      display:grid;
      grid-template-columns: 1fr 320px;
      gap:24px;
      align-items:start;
      min-height:0;
    }
    @media(max-width:1100px){
      .body-grid{ grid-template-columns:1fr; }
    }

    .body-l{
      display:flex; flex-direction:column; gap:20px;
      min-width:0;
      align-self:end;
    }

    .scan-strip{
      width:100%;
      display:flex; align-items:center; gap:14px;
      font-size:10.5px;
      color:var(--ink-3);
      letter-spacing:.2em;
      text-transform:uppercase;
    }
    .scan-strip .bar{
      flex:1; height:1px; background:var(--rule);
      position:relative; overflow:hidden;
    }
    .scan-strip .bar::after{
      content:""; position:absolute; inset:0;
      width:30%;
      background: linear-gradient(90deg, transparent, var(--acc), transparent);
      animation: scan 3.4s linear infinite;
    }
    @keyframes scan{ 0%{transform:translateX(-100%)} 100%{transform:translateX(380%)} }

    .view-readout{
      display:inline-flex; align-items:center; gap:14px;
      padding:8px 14px;
      border:1px solid var(--rule);
      background: rgba(13,14,12,.7);
      backdrop-filter: blur(6px);
      font-size:10.5px;
      letter-spacing:.16em;
      text-transform:uppercase;
      color:var(--ink-3);
      align-self:flex-start;
    }
    .view-readout .vname{ color:var(--acc); }
    .view-readout .sep{ color:var(--rule); }

    /* ── Side info panel ── */
    .side{
      display:flex; flex-direction:column; gap:14px;
      align-self:end;
    }
    .side-block{
      border:1px solid var(--rule);
      background: rgba(13,14,12,.78);
      backdrop-filter: blur(8px);
      padding:14px 16px 16px;
      display:flex; flex-direction:column; gap:8px;
      transition: border-color .2s;
    }
    .side-block.is-idle{
      border-style:dashed;
      border-color: var(--rule-2);
      background: transparent;
      backdrop-filter:none;
    }
    .side-block .crumb{
      font-size:9.5px;
      letter-spacing:.22em;
      text-transform:uppercase;
      color:var(--acc);
    }
    .side-block .ttl{
      margin:0;
      font-size:14px;
      font-weight:500;
      line-height:1.3;
      color:var(--ink);
      letter-spacing:-.005em;
    }
    .side-block .body{
      margin:0;
      font-size:11.5px;
      line-height:1.6;
      color:var(--ink-2);
      text-wrap:pretty;
    }
    .side-block.is-idle .body{ color:var(--ink-3); font-size:11px;}

    .stat-row{
      display:grid; grid-template-columns:1fr 1fr;
      border-top:1px solid var(--rule);
    }
    .stat{
      padding:10px 14px;
      display:flex; flex-direction:column; gap:3px;
      border-right:1px solid var(--rule);
    }
    .stat:last-child{ border-right:none;}
    .stat .l{
      font-size:9px; letter-spacing:.2em; text-transform:uppercase;
      color:var(--ink-3);
    }
    .stat .v{
      font-size:18px; color:var(--acc);
      font-weight:500;
      letter-spacing:-.01em;
    }

    /* ── Quick links footer ── */
    .footer-rail{
      border-top:1px solid var(--rule);
      padding-top:14px;
      display:flex; flex-direction:column; gap:14px;
      min-width:0;
    }
    .footer-head{
      display:flex; align-items:center; justify-content:space-between;
      font-size:10.5px;
      letter-spacing:.22em;
      text-transform:uppercase;
      color:var(--ink-3);
    }
    .footer-head b{ color:var(--ink-2); font-weight:500;}
    .quick-links{
      display:grid;
      grid-template-columns:repeat(5, 1fr);
      gap:0;
      border-top:1px solid var(--rule);
      border-bottom:1px solid var(--rule);
    }
    @media(max-width:1100px){
      .quick-links{ grid-template-columns:repeat(3, 1fr); }
    }
    @media(max-width:720px){
      .quick-links{ grid-template-columns:1fr 1fr; }
    }
    .qlink{
      position:relative;
      display:flex; flex-direction:column;
      gap:10px;
      padding:18px 20px 20px;
      border-right:1px solid var(--rule);
      text-decoration:none;
      color:var(--ink);
      transition: background .18s, color .18s;
      min-width:0;
    }
    .qlink:last-child{ border-right:none;}
    .qlink::before{
      content:"";
      position:absolute; left:0; top:0;
      width:100%; height:1px;
      background: var(--acc);
      transform: scaleX(0); transform-origin:left;
      transition: transform .25s;
    }
    .qlink:hover{ background: var(--bg-2); }
    .qlink:hover::before, .qlink[data-active="true"]::before{ transform: scaleX(1); }
    .qlink[data-active="true"]{ background: var(--bg-2); }

    .qlink .qcode{
      font-size:10px; letter-spacing:.22em; text-transform:uppercase;
      color:var(--ink-3);
      display:flex; align-items:center; gap:8px;
    }
    .qlink:hover .qcode, .qlink[data-active="true"] .qcode{ color:var(--acc);}
    .qlink .qcode .num{ color:var(--acc);}
    .qlink .qttl{
      font-size:13.5px; line-height:1.35; font-weight:500;
      letter-spacing:-.005em;
      color:var(--ink);
      text-wrap:balance;
    }
    .qlink .qarrow{
      position:absolute; top:18px; right:20px;
      width:12px; height:12px;
      color:var(--ink-3);
      transition: color .15s, transform .2s;
    }
    .qlink:hover .qarrow, .qlink[data-active="true"] .qarrow{
      color:var(--acc);
      transform: translate(2px,-2px);
    }

    /* ── Ticker / Peringatan ── */
    .ticker{
      display:flex; align-items:stretch;
      border:1px solid var(--rule);
      background: rgba(13,14,12,.7);
      backdrop-filter: blur(6px);
      font-size:11px;
      letter-spacing:.04em;
      overflow:hidden;
    }
    .ticker .ttag{
      flex:0 0 auto;
      padding:9px 14px;
      border-right:1px solid var(--rule);
      font-size:10.5px;
      letter-spacing:.2em;
      text-transform:uppercase;
      color:var(--warn);
      display:flex; align-items:center; gap:8px;
    }
    .ticker .ttag::before{
      content:""; width:6px; height:6px; background:var(--warn);
    }
    .ticker .tport{
      flex:1; overflow:hidden; position:relative;
      align-self:center;
    }
    .ticker .ttrack{
      display:inline-flex; white-space:nowrap;
      animation: tickerMove 50s linear infinite;
    }
    .ticker:hover .ttrack{ animation-play-state:paused;}
    .ticker .ttext{
      padding-right:36px;
      color:var(--ink-2);
    }
    .ticker .tsep{
      width:1px; height:10px; background:var(--rule);
      margin:auto 14px;
    }
    @keyframes tickerMove{ 0%{transform:translateX(0)} 100%{transform:translateX(-50%)}}

    /* ── Engine SVG part styling ── */
    .part3d{
      transition: transform 1.2s cubic-bezier(.22,.68,0,1), opacity .8s ease;
      transform-box: fill-box;
    }
    .part-stroke{
      fill: none;
      stroke: rgba(184,184,168,.55);
      stroke-width: 1;
      stroke-linejoin: round;
      stroke-linecap: round;
      transition: stroke .35s, stroke-width .35s;
    }
    .part-fill{
      fill: rgba(237,237,223,.02);
      transition: fill .35s;
    }
    .part3d.highlight .part-stroke{
      stroke: var(--acc);
      stroke-width: 1.4;
      filter: drop-shadow(0 0 6px oklch(0.88 0.21 130 / .45));
    }
    .part3d.highlight .part-fill{ fill: var(--acc-bg); }

    .status-ok .part-stroke{ stroke: var(--acc); opacity:.85;}
    .status-ok .part-fill{ fill: var(--acc-bg);}
    .status-warn .part-stroke{ stroke: var(--warn);}
    .status-warn .part-fill{ fill: oklch(0.82 0.16 75 / .12);}
    .status-bad .part-stroke{ stroke: var(--bad);}
    .status-bad .part-fill{ fill: oklch(0.72 0.18 25 / .12);}

    .dim-line{
      stroke: var(--acc-dim);
      stroke-width: .7;
      stroke-dasharray: 2 3;
      fill:none;
    }
    .num-bubble{
      fill: var(--bg);
      stroke: var(--acc);
      stroke-width: 1;
    }
    .num-text{
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      fill: var(--acc);
      font-weight: 500;
      text-anchor: middle;
      dominant-baseline: central;
      letter-spacing: .04em;
    }

    .part-label-grp .num-bubble{ transition: all .2s;}
    .part-label-grp.hov .num-bubble{
      fill: var(--acc);
      stroke: var(--acc);
    }
    .part-label-grp.hov .num-text{ fill: var(--bg); font-weight:600;}

    /* ── Bottom hint bar ── */
    .hint{
      position:fixed; bottom:0; left:0; right:0;
      z-index:6;
      pointer-events:none;
      border-top: 1px solid var(--rule);
      background: linear-gradient(180deg, transparent, rgba(13,14,12,.92) 60%);
      padding: 18px 28px 12px;
      display:flex; align-items:center; justify-content:space-between;
      font-size:10.5px;
      letter-spacing:.18em;
      text-transform:uppercase;
      color: var(--ink-3);
    }
    .hint b{ color: var(--acc); font-weight:500;}
    .hint .keys{ display:flex; align-items:center; gap:14px;}
    .hint .key{
      padding:3px 7px; border:1px solid var(--rule);
      font-size:9.5px; color:var(--ink-2);
      letter-spacing:.1em;
    }
    .hint-r{ display:flex; align-items:center; gap:14px;}
    .hint-r .pos{ color:var(--ink-2);}
  </style>
</head>
<body>
  <div class="engine-bg" id="engineBg"></div>
  <div id="root"></div>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="engine.v2.jsx"></script>
  <script type="text/babel" src="app.v2.jsx"></script>
</body>
</html>
