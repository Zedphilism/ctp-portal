<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portal CT&P | Sistem Pemeriksaan ATM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    :root{
      --bg:#072b1d;
      --bg-deep:#04190f;
      --panel:#0c3a28;
      --text:#f5fff6;
      --muted:#bfd8c6;
      --line:rgba(224,255,232,.14);
      --line-strong:rgba(224,255,232,.28);
      --tech:#1ba05a;
      --tech-bright:#2fd47a;
      --gold:#d7a447;
      --warn:#e0a040;
      --danger:#e05c5c;
    }

    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      font-family:'Sora',system-ui,sans-serif;
      background:
        radial-gradient(1400px 900px at 50% 50%, rgba(27,160,90,.12), transparent 65%),
        var(--bg-deep);
      color:var(--text);
      overflow-x:hidden;
      min-height:100vh;
    }

    body::before{
      content:"";
      position:fixed;inset:0;pointer-events:none;z-index:0;
      opacity:.04;
      background-image:
        linear-gradient(45deg, rgba(255,255,255,.9) 1px, transparent 1px),
        linear-gradient(-45deg, rgba(255,255,255,.9) 1px, transparent 1px);
      background-size:32px 32px;
    }

    /* Full-bleed engine background canvas */
    .engine-bg{
      position:fixed;
      inset:0;
      z-index:1;
      pointer-events:none;
      display:flex;align-items:center;justify-content:center;
    }
    .engine-bg svg{
      width:100%;height:100%;
      pointer-events:auto;
    }

    /* Subtle vignette over engine */
    .engine-bg::after{
      content:"";
      position:absolute;inset:0;pointer-events:none;
      background:
        radial-gradient(ellipse at center, transparent 50%, rgba(4,25,15,.55) 100%),
        linear-gradient(180deg, rgba(4,25,15,.6) 0%, transparent 25%, transparent 75%, rgba(4,25,15,.7) 100%);
    }

    .stage{
      position:relative;
      z-index:5;
      max-width:100vw;
      min-width:0;
      overflow:hidden;
      max-width:1480px;
      margin:0 auto;
      padding:32px 36px 40px;
      min-height:100vh;
      display:grid;
      grid-template-rows:auto 1fr auto;
      gap:24px;
      pointer-events:none;
    }
    .stage > *{pointer-events:auto}

    /* ── Top bar ───────────────────────────────── */
    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:24px;
    }
    .brand{display:flex;align-items:center;gap:14px}
    .brand-marks{display:flex;gap:8px}
    .brand-marks img{
      width:38px;height:38px;object-fit:contain;
      filter:drop-shadow(0 4px 12px rgba(0,0,0,.4));
    }
    .brand-meta{display:flex;flex-direction:column;line-height:1.2}
    .brand-meta .eyebrow{
      font-size:9px;letter-spacing:.4em;text-transform:uppercase;
      color:var(--muted);font-weight:700;
    }
    .brand-meta .title{
      font-family:'Fraunces',serif;font-style:italic;
      font-size:18px;font-weight:700;
      font-variation-settings:'opsz' 24;
    }

    .topbar-meta{
      display:flex;align-items:center;gap:10px;font-size:11px;
    }
    .meta-pill{
      display:inline-flex;align-items:center;gap:8px;
      padding:8px 14px;border-radius:999px;
      border:1px solid var(--line);
      background:rgba(7,43,29,.78);
      backdrop-filter:blur(8px);
      font-family:'DM Mono',monospace;font-size:10px;
      letter-spacing:.05em;color:var(--muted);
    }
    .meta-pill .dot{
      width:6px;height:6px;border-radius:50%;
      background:var(--tech-bright);
      box-shadow:0 0 0 3px rgba(47,212,122,.18);
      animation:pulseDot 2.4s ease-in-out infinite;
    }
    @keyframes pulseDot{
      0%,100%{opacity:1;transform:scale(1)}
      50%{opacity:.5;transform:scale(.85)}
    }

    /* ── Main grid ─────────────────────────────── */
    .main-grid{
      display:grid;
      grid-template-columns:1fr 280px;
      gap:24px;
      align-items:stretch;
      min-height:0;
      min-width:0;
    }
    .cta-wrap{display:flex;justify-content:flex-end;align-items:flex-end}
    @media(max-width:1180px){
      .main-grid{grid-template-columns:1fr;}
      .cta-wrap{justify-content:flex-start}
    }

    /* ── Side panel: live description ────────────── */
    .side-panel{
      display:flex;
      flex-direction:column;
      gap:14px;
      align-self:stretch;
      justify-content:flex-end;
      min-width:0;
    }
    .info-card{
      position:relative;
      background:rgba(8,18,14,.55);
      border:1px solid var(--line);
      border-radius:6px;
      padding:10px 14px;
      backdrop-filter:blur(6px);
      display:flex;
      flex-direction:column;
      gap:6px;
      max-width:260px;
      align-self:flex-end;
      margin-left:auto;
      transition:border-color .25s, background .25s;
    }
    .info-card::before{
      content:"";
      position:absolute; top:0; left:0;
      width:24px; height:1px;
      background:var(--tech-bright);
      opacity:.7;
    }
    .info-card::after{
      content:"";
      position:absolute; top:0; right:0;
      width:1px; height:24px;
      background:var(--tech-bright);
      opacity:.7;
    }
    .info-code{
      font-family:'DM Mono',monospace;
      font-size:9px;
      letter-spacing:.16em;
      color:var(--tech-bright);
      text-transform:uppercase;
    }
    .info-title{
      font-size:12.5px;
      font-weight:700;
      line-height:1.25;
      letter-spacing:-.005em;
      margin:0;
      color:var(--ink);
    }
    .info-body{
      font-size:11px;
      line-height:1.45;
      color:rgba(232,242,237,.78);
      margin:0;
      text-wrap:pretty;
    }
    .info-body-muted{color:var(--muted)}
    .info-card.is-idle{
      background:transparent;
      border:1px dashed rgba(224,255,232,.12);
      box-shadow:none;
      backdrop-filter:none;
      min-height:0;
      padding:10px 14px;
      align-self:flex-end;
      max-width:240px;
      margin-left:auto;
    }
    .info-card.is-idle::before,
    .info-card.is-idle::after{display:none}
    .info-card.is-idle .info-body{font-size:11px;line-height:1.4}

    /* ── Left: copy panel ──────────────────────── */
    .copy-panel{
      display:flex;flex-direction:column;gap:18px;
      padding:28px 24px;
      border:1px solid var(--line);
      border-radius:24px;
      background:linear-gradient(180deg,rgba(7,43,29,.18),rgba(4,25,15,.12));
      backdrop-filter:blur(6px);
    }
    .copy-tag{
      display:inline-flex;align-items:center;gap:8px;
      padding:6px 12px;border-radius:999px;
      border:1px solid var(--line);
      background:rgba(47,212,122,.08);
      width:max-content;
      font-size:9.5px;letter-spacing:.4em;text-transform:uppercase;
      font-weight:700;color:var(--tech-bright);
    }
    .copy-tag::before{
      content:"";width:6px;height:6px;border-radius:50%;
      background:var(--tech-bright);
      box-shadow:0 0 8px var(--tech-bright);
    }
    .copy-panel h1{
      margin:0;
      font-family:'Fraunces',serif;
      font-style:italic;font-weight:700;
      font-variation-settings:'opsz' 96;
      font-size:clamp(28px,3vw,40px);
      line-height:1.02;
      letter-spacing:-.02em;
      text-wrap:balance;
    }
    .copy-panel h1 em{
      font-style:normal;color:var(--tech-bright);
      font-variation-settings:'opsz' 96;
    }
    .copy-panel p.lede{
      margin:0;font-size:13px;line-height:1.7;color:var(--muted);
      text-wrap:pretty;
    }

    .copy-stats{
      display:grid;grid-template-columns:1fr 1fr;
      gap:1px;background:var(--line);
      border:1px solid var(--line);
      border-radius:14px;overflow:hidden;
      margin-top:8px;
    }
    .copy-stat{
      padding:12px 14px;
      background:rgba(7,43,29,.85);
      display:flex;flex-direction:column;gap:3px;
    }
    .copy-stat .label{
      font-size:8.5px;letter-spacing:.35em;text-transform:uppercase;
      color:var(--muted);font-weight:700;
    }
    .copy-stat .val{
      font-family:'DM Mono',monospace;
      font-size:22px;font-weight:500;
      color:var(--tech-bright);line-height:1;
    }
    .copy-stat .sub{font-size:10px;color:var(--muted)}

    .copy-cta{
      display:inline-flex;align-items:center;justify-content:space-between;
      gap:10px;padding:13px 18px;
      border-radius:14px;
      border:1px solid var(--tech);
      background:linear-gradient(180deg,rgba(47,212,122,.18),rgba(47,212,122,.08));
      color:var(--text);
      font-weight:700;font-size:13px;
      text-decoration:none;
      transition:.18s;cursor:pointer;
    }
    .copy-cta:hover{
      background:linear-gradient(180deg,rgba(47,212,122,.32),rgba(47,212,122,.18));
      transform:translateY(-1px);
      box-shadow:0 8px 24px rgba(47,212,122,.22);
    }
    .copy-cta svg{width:16px;height:16px}

    /* ── Center: spacer ────────────────────────── */
    .center-area{
      display:flex;flex-direction:column;
      justify-content:space-between;
      pointer-events:none;
    }
    .center-area > *{pointer-events:auto}
    .view-readout{
      align-self:center;
      padding:10px 18px;
      border:1px solid var(--line);
      border-radius:999px;
      background:rgba(7,43,29,.78);
      backdrop-filter:blur(10px);
      display:flex;align-items:center;gap:14px;
      font-family:'DM Mono',monospace;font-size:10.5px;
      letter-spacing:.06em;
    }
    .view-readout .lbl{color:var(--muted)}
    .view-readout .vname{color:var(--tech-bright);font-weight:500}
    .view-readout .sep{color:var(--line-strong)}

    .scan-strip{
      align-self:center;width:60%;
      height:2px;background:var(--line);
      border-radius:2px;overflow:hidden;
      position:relative;
    }
    .scan-strip::after{
      content:"";position:absolute;inset:0;
      background:linear-gradient(90deg,transparent,var(--tech-bright),transparent);
      width:30%;
      animation:scanMove 3.5s linear infinite;
    }
    @keyframes scanMove{
      0%{transform:translateX(-100%)}
      100%{transform:translateX(380%)}
    }

    /* ── Right: views panel ────────────────────── */
    .views-panel{
      display:flex;flex-direction:column;gap:12px;
      padding:22px 20px;
      border:1px solid var(--line);
      border-radius:24px;
      background:linear-gradient(180deg,rgba(7,43,29,.85),rgba(4,25,15,.85));
      backdrop-filter:blur(14px);
    }
    .views-head{
      display:flex;align-items:center;justify-content:space-between;
    }
    .views-head h3{
      margin:0;font-size:10px;letter-spacing:.4em;
      text-transform:uppercase;font-weight:800;
    }
    .views-head .count{
      font-family:'DM Mono',monospace;font-size:10px;
      color:var(--muted);letter-spacing:.05em;
    }
    .views-list{display:flex;flex-direction:column;gap:8px}

    .view-btn{
      position:relative;
      display:flex;flex-direction:column;gap:4px;
      padding:12px 14px;
      border:1px solid var(--line);
      border-radius:12px;
      background:rgba(255,255,255,.025);
      color:var(--text);
      font-family:'Sora',sans-serif;
      cursor:pointer;
      text-align:left;
      transition:.18s;
      overflow:hidden;
      text-decoration:none;
    }
    .view-btn::before{
      content:"";position:absolute;left:0;top:0;bottom:0;
      width:3px;background:var(--tech);
      transform:scaleY(0);transform-origin:top;
      transition:transform .25s;
    }
    .view-btn:hover{
      background:rgba(47,212,122,.08);
      border-color:rgba(47,212,122,.4);
    }
    .view-btn.active{
      background:rgba(47,212,122,.12);
      border-color:rgba(47,212,122,.55);
      box-shadow:0 0 0 1px rgba(47,212,122,.2),0 8px 22px rgba(47,212,122,.14);
    }
    .view-btn.active::before{transform:scaleY(1)}
    .view-btn .row1{
      display:flex;align-items:center;justify-content:space-between;gap:10px;
    }
    .view-btn .label{font-weight:700;font-size:13px}
    .view-btn .code{
      font-family:'DM Mono',monospace;
      font-size:9.5px;letter-spacing:.1em;
      color:var(--muted);
      padding:2px 7px;
      border:1px solid var(--line);
      border-radius:999px;
      background:rgba(0,0,0,.25);
    }
    .view-btn:hover .code,
    .view-btn.active .code{
      color:var(--tech-bright);
      border-color:rgba(47,212,122,.4);
    }
    .view-btn .desc{font-size:11px;color:var(--muted);line-height:1.5}

    .legend{
      margin-top:6px;padding-top:12px;
      border-top:1px dashed var(--line);
      display:flex;flex-direction:column;gap:8px;
    }
    .legend h4{
      margin:0;font-size:9.5px;letter-spacing:.4em;
      text-transform:uppercase;color:var(--muted);font-weight:700;
    }
    .legend-row{
      display:flex;align-items:center;gap:10px;
      font-size:11px;color:var(--muted);
    }
    .legend-row .sw{
      width:12px;height:12px;border-radius:3px;flex-shrink:0;
      border:1px solid rgba(255,255,255,.2);
    }
    .legend-row .nm{flex:1}
    .legend-row .ct{font-family:'DM Mono',monospace;font-size:10px}

    /* ── Footer: form quick links ──────────────── */
    .quick-links{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:10px;
      min-width:0;
    }
    @media(max-width:1100px){
      .quick-links{grid-template-columns:repeat(3,1fr)}
    }
    @media(max-width:720px){
      .quick-links{grid-template-columns:1fr 1fr}
    }
    .qlink{
      position:relative;
      padding:16px 18px;
      border:1px solid var(--line);
      border-radius:16px;
      background:linear-gradient(180deg,rgba(7,43,29,.85),rgba(4,25,15,.85));
      backdrop-filter:blur(12px);
      text-decoration:none;color:var(--text);
      display:flex;flex-direction:column;gap:6px;
      transition:.2s;
      overflow:hidden;
    }
    .qlink::before{
      content:"";position:absolute;left:0;top:0;bottom:0;
      width:3px;background:var(--tech-bright);
      transform:scaleY(0);transform-origin:top;
      transition:transform .25s;
    }
    .qlink:hover{
      border-color:rgba(47,212,122,.5);
      background:linear-gradient(180deg,rgba(47,212,122,.16),rgba(7,43,29,.85));
      transform:translateY(-2px);
      box-shadow:0 12px 28px rgba(47,212,122,.18);
    }
    .qlink:hover::before{transform:scaleY(1)}
    .qlink .qcode{
      font-family:'DM Mono',monospace;font-size:9.5px;
      color:var(--tech-bright);letter-spacing:.1em;
    }
    .qlink .qtitle{font-size:13px;font-weight:700;line-height:1.3}
    .qlink[data-active="true"]{
      border-color:var(--tech-bright);
      background:linear-gradient(180deg,rgba(47,212,122,.22),rgba(7,43,29,.9));
      box-shadow:0 14px 30px rgba(47,212,122,.22);
    }
    .qlink[data-active="true"]::before{transform:scaleY(1)}
    .qlink[data-active="true"] .qarrow{
      border-color:var(--tech-bright);
      background:rgba(47,212,122,.22);
      transform:rotate(-45deg);
    }
    .qlink .qarrow{
      position:absolute;top:14px;right:14px;
      width:24px;height:24px;border-radius:50%;
      border:1px solid var(--line);
      display:flex;align-items:center;justify-content:center;
      transition:.2s;
    }
    .qlink:hover .qarrow{
      border-color:var(--tech-bright);
      background:rgba(47,212,122,.18);
      transform:rotate(-45deg);
    }
    .qlink .qarrow svg{width:11px;height:11px;color:var(--tech-bright)}

    /* ─── SVG part styling ─── */
    .part3d{
      transition:transform 1.2s cubic-bezier(.22,.68,0,1),
                 opacity .8s ease;
      transform-box:fill-box;
    }
    .part-stroke{
      fill:none;
      stroke:rgba(191,216,198,.55);
      stroke-width:1;
      stroke-linejoin:round;
      stroke-linecap:round;
      transition:stroke .6s ease, stroke-width .6s ease;
    }
    .part-fill{
      fill:rgba(47,212,122,.04);
      transition:fill .6s ease;
    }
    .part3d.highlight .part-stroke{
      stroke:var(--tech-bright);
      stroke-width:1.5;
      filter:drop-shadow(0 0 8px rgba(47,212,122,.55));
    }
    .part3d.highlight .part-fill{
      fill:rgba(47,212,122,.12);
    }

    .status-ok .part-stroke{stroke:rgba(47,212,122,.85)}
    .status-ok .part-fill{fill:rgba(47,212,122,.12)}
    .status-warn .part-stroke{stroke:var(--warn)}
    .status-warn .part-fill{fill:rgba(224,160,64,.14)}
    .status-bad .part-stroke{stroke:var(--danger)}
    .status-bad .part-fill{fill:rgba(224,92,92,.14)}

    .dim-line{
      stroke:rgba(47,212,122,.4);
      stroke-width:.7;
      stroke-dasharray:3 3;
      fill:none;
    }
    .label-box{
      fill:rgba(7,43,29,.92);
      stroke:rgba(47,212,122,.5);
      stroke-width:.7;
    }
    .label-text{
      font-family:'DM Mono',monospace;
      font-size:8px;
      fill:var(--tech-bright);
      letter-spacing:.04em;
    }
    .label-num{
      font-family:'DM Mono',monospace;
      font-size:8.5px;
      fill:var(--text);
      font-weight:500;
    }
    .num-bubble{
      fill:var(--bg-deep);
      stroke:var(--tech-bright);
      stroke-width:1.2;
    }
    .num-text{
      font-family:'DM Mono',monospace;
      font-size:9.5px;
      fill:var(--tech-bright);
      font-weight:500;
      text-anchor:middle;
      dominant-baseline:central;
    }

    /* ─── Ticker (PERINGATAN) ─── */
    .ticker{
      width:min(820px, 100%);
      max-width:100%;
      margin:0 auto 6px;
      pointer-events:auto;
      min-width:0;
    }
    .ticker-inner{
      border-radius:14px;
      border:1px solid var(--line);
      background:rgba(8,18,14,.55);
      backdrop-filter:blur(10px);
      overflow:hidden;
      box-shadow:0 18px 55px rgba(0,0,0,.35);
    }
    .ticker-row{display:flex;align-items:center;gap:10px;padding:8px 11px;}
    .ticker-tag{
      flex:0 0 auto;
      font-size:10.5px;font-weight:900;letter-spacing:.9px;text-transform:uppercase;
      color:var(--gold);
      padding:5px 10px;border-radius:999px;
      border:1px solid var(--line);
      background:rgba(215,164,71,.06);
    }
    .ticker-viewport{position:relative;overflow:hidden;flex:1;height:18px;}
    .ticker-track{
      display:inline-flex;align-items:center;white-space:nowrap;will-change:transform;
      animation:tickerMove 46s linear infinite;
    }
    .ticker-text{font-size:11.5px;font-weight:600;color:rgba(231,238,248,.86);padding-right:34px;letter-spacing:.02em;}
    .ticker-dot{
      width:6px;height:6px;border-radius:50%;
      background:var(--gold);box-shadow:0 0 0 3px rgba(215,164,71,.12);
      margin:0 12px;flex:0 0 auto;
    }
    .ticker-inner:hover .ticker-track{animation-play-state:paused;}
    @keyframes tickerMove{0%{transform:translateX(0);}100%{transform:translateX(-50%);}}

    /* ─── Part label group hover affordance ─── */
    .part-label-grp .label-box{
      fill:rgba(8,18,14,.78);
      stroke:rgba(47,212,122,.32);
      stroke-width:.7;
      transition:all .25s;
    }
    .part-label-grp.hov .label-box{
      stroke:var(--tech-bright);
      stroke-width:1.2;
      fill:rgba(47,212,122,.12);
      filter:drop-shadow(0 0 6px rgba(47,212,122,.45));
    }
    .part-label-grp .label-arrow{opacity:.6;transition:opacity .2s, transform .2s;}
    .part-label-grp.hov .label-arrow{opacity:1;}

    /* hint text */
    .hover-hint{
      position:fixed;bottom:16px;left:50%;
      transform:translateX(-50%);
      padding:7px 14px;border-radius:999px;
      border:1px solid var(--line);
